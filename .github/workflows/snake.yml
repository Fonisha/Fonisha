name: Update contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: Fonisha
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ff3b30&color_dots=%23351b19,%239c3328,%23d94332,%23ff6b35,%23ffb347
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
